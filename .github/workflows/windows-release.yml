name: Windows Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/windows-release.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinavault-reimagined-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-release:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    name: Validate, package, and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Prepare diagnostics directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path test-results | Out-Null

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund 2>&1 | Tee-Object -FilePath test-results/npm-install.log

      - name: Run standalone release gates
        shell: pwsh
        run: npm test 2>&1 | Tee-Object -FilePath test-results/release-gates.log

      - name: TypeScript validation
        shell: pwsh
        run: npm run typecheck 2>&1 | Tee-Object -FilePath test-results/typecheck.log

      - name: Production frontend build
        shell: pwsh
        run: npm run build 2>&1 | Tee-Object -FilePath test-results/frontend-build.log

      - name: Prepare Windows application icon
        shell: pwsh
        run: npm run prepare:icon 2>&1 | Tee-Object -FilePath test-results/icon-preparation.log

      - name: Rust validation
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath test-results/cargo-check.log

      - name: Build MSI and NSIS installers
        shell: pwsh
        run: npm run desktop:build 2>&1 | Tee-Object -FilePath test-results/desktop-build.log
        env:
          CI: true

      - name: Verify installer outputs
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -ErrorAction Stop)
          $exe = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction Stop)
          if ($msi.Count -lt 1) { throw 'MSI installer was not produced.' }
          if ($exe.Count -lt 1) { throw 'NSIS EXE installer was not produced.' }
          "MSI=$($msi[0].FullName)" | Set-Content test-results/installer-verification.txt
          "EXE=$($exe[0].FullName)" | Add-Content test-results/installer-verification.txt

      - name: Generate verified build notes
        shell: pwsh
        run: |
          @"
          # CinaVault ReImagined v0.0.1

          Verified by GitHub Actions run ${{ github.run_number }} on commit ${{ github.sha }}.

          - Standalone release gates: passed
          - TypeScript validation: passed
          - Production frontend build: passed
          - Rust validation: passed
          - MSI packaging: passed
          - NSIS packaging: passed
          "@ | Set-Content test-results/BUILD_NOTES.md -Encoding utf8

      - name: Upload Windows installers and evidence
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-ReImagined-v0.0.1-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            test-results/BUILD_NOTES.md
            test-results/installer-verification.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish CinaVault ReImagined v0.0.1 prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'cinavault-reimagined-v0.0.1'
          $assets = @()
          $assets += @(Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi').FullName
          $assets += @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe').FullName
          $assets += (Resolve-Path 'test-results/BUILD_NOTES.md').Path
          $assets += (Resolve-Path 'test-results/installer-verification.txt').Path

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets.' }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title 'CinaVault ReImagined v0.0.1' --notes-file 'test-results/BUILD_NOTES.md' --prerelease --target $env:TARGET_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update the GitHub prerelease.' }
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:TARGET_SHA --title 'CinaVault ReImagined v0.0.1' --notes-file 'test-results/BUILD_NOTES.md' --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create the GitHub prerelease.' }
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,tagName,isPrerelease,assets | Set-Content test-results/release-verification.json -Encoding utf8

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-ReImagined-v0.0.1-build-diagnostics
          path: |
            test-results/**
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
