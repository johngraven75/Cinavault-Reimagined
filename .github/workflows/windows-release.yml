name: Windows Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cinavault-reimagined-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-release:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    name: Validate, package, and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Prepare diagnostics directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path test-results | Out-Null

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path package-lock.json) {
            npm ci --no-audit --no-fund 2>&1 | Tee-Object -FilePath test-results/npm-install.log
          } else {
            npm install --no-audit --no-fund 2>&1 | Tee-Object -FilePath test-results/npm-install.log
          }
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed.' }

      - name: Run standalone release gates
        shell: pwsh
        run: npm test 2>&1 | Tee-Object -FilePath test-results/release-gates.log

      - name: TypeScript validation
        shell: pwsh
        run: npm run typecheck 2>&1 | Tee-Object -FilePath test-results/typecheck.log

      - name: Production frontend build
        shell: pwsh
        run: npm run build 2>&1 | Tee-Object -FilePath test-results/frontend-build.log

      - name: Prepare Windows application icon
        shell: pwsh
        run: npm run prepare:icon 2>&1 | Tee-Object -FilePath test-results/icon-preparation.log

      - name: Rust validation
        shell: pwsh
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath test-results/cargo-check.log

      - name: Build MSI and NSIS installers
        shell: pwsh
        run: npm run desktop:build 2>&1 | Tee-Object -FilePath test-results/desktop-build.log
        env:
          CI: true

      - name: Verify installer outputs
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -ErrorAction Stop)
          $exe = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction Stop)
          if ($msi.Count -lt 1) { throw 'MSI installer was not produced.' }
          if ($exe.Count -lt 1) { throw 'NSIS EXE installer was not produced.' }
          "MSI=$($msi[0].FullName)" | Set-Content test-results/installer-verification.txt
          "EXE=$($exe[0].FullName)" | Add-Content test-results/installer-verification.txt

      - name: Generate verified build notes
        shell: pwsh
        run: |
          @"
          # CinaVault ReImagined v0.0.2

          Verified by GitHub Actions run ${{ github.run_number }} on commit ${{ github.sha }}.

          - Standalone release gates: passed
          - TypeScript validation: passed
          - Production frontend build: passed
          - Rust validation: passed
          - MSI packaging: passed
          - NSIS packaging: passed
          "@ | Set-Content test-results/BUILD_NOTES.md -Encoding utf8

      - name: Upload Windows installers and evidence
        uses: actions/upload-artifact@v7
        with:
          name: CinaVault-ReImagined-v0.0.2-Windows-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            test-results/BUILD_NOTES.md
            test-results/installer-verification.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish CinaVault ReImagined v0.0.2 prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = 'cinavault-reimagined-v0.0.2'
          $repo = $env:GITHUB_REPOSITORY
          $assets = @(
            @(Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -ErrorAction Stop).FullName
            @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction Stop).FullName
            (Resolve-Path 'test-results/BUILD_NOTES.md').Path
            (Resolve-Path 'test-results/installer-verification.txt').Path
          )

          gh release view $tag --repo $repo 1>$null 2>$null
          $releaseExists = $LASTEXITCODE -eq 0

          if (-not $releaseExists) {
            gh api "repos/$repo/git/ref/tags/$tag" 1>$null 2>$null
            if ($LASTEXITCODE -ne 0) {
              gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$env:TARGET_SHA"
              if ($LASTEXITCODE -ne 0) { throw "Failed to create release tag $tag at $env:TARGET_SHA." }
            }

            gh release create $tag @assets --repo $repo --verify-tag --title 'CinaVault ReImagined v0.0.2' --notes-file 'test-results/BUILD_NOTES.md' --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create the GitHub prerelease with required assets.' }
          } else {
            gh release upload $tag @assets --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update prerelease assets.' }

            gh release edit $tag --repo $repo --title 'CinaVault ReImagined v0.0.2' --notes-file 'test-results/BUILD_NOTES.md' --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update prerelease metadata.' }
          }

          $verification = gh release view $tag --repo $repo --json url,tagName,isPrerelease,targetCommitish,assets
          if ($LASTEXITCODE -ne 0) { throw 'Failed to verify the GitHub prerelease.' }
          $verification | Set-Content test-results/release-verification.json -Encoding utf8

          $release = $verification | ConvertFrom-Json
          if (-not $release.isPrerelease) { throw 'Published release is not marked as a prerelease.' }
          if ($release.tagName -ne $tag) { throw "Published release tag does not match $tag." }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $requiredPatterns = @('*.msi', '*.exe', 'BUILD_NOTES.md', 'installer-verification.txt')
          foreach ($pattern in $requiredPatterns) {
            if (-not ($assetNames | Where-Object { $_ -like $pattern })) {
              throw "Published release is missing required asset pattern: $pattern"
            }
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CinaVault-ReImagined-v0.0.2-build-diagnostics-${{ github.run_number }}
          path: |
            test-results/**
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
