name: Windows Build and Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/windows-release.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinavault-reimagined-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-release:
    name: Validate, package, and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare diagnostics directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path test-results | Out-Null

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund 2>&1 | Tee-Object -FilePath test-results/npm-install.log

      - name: Run standalone release gates
        shell: pwsh
        run: npm test 2>&1 | Tee-Object -FilePath test-results/release-gates.log

      - name: TypeScript validation
        shell: pwsh
        run: npm run typecheck 2>&1 | Tee-Object -FilePath test-results/typecheck.log

      - name: Production frontend build
        shell: pwsh
        run: npm run build 2>&1 | Tee-Object -FilePath test-results/frontend-build.log

      - name: Prepare Windows application icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          $icon = ''
          [IO.File]::WriteAllBytes('src-tauri/icons/icon.ico', [Convert]::FromBase64String($icon))
          if (-not (Test-Path src-tauri/icons/icon.ico)) { throw 'Windows icon preparation failed.' }

      - name: Rust validation
        shell: pwsh
        run: cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath test-results/cargo-check.log

      - name: Build MSI and NSIS installers
        shell: pwsh
        run: npm run desktop:build 2>&1 | Tee-Object -FilePath test-results/desktop-build.log
        env:
          CI: true

      - name: Verify installer outputs
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -ErrorAction Stop
          $exe = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction Stop
          if ($msi.Count -lt 1) { throw 'MSI installer was not produced.' }
          if ($exe.Count -lt 1) { throw 'NSIS EXE installer was not produced.' }
          "MSI=$($msi.FullName)" | Set-Content test-results/installer-verification.txt
          "EXE=$($exe.FullName)" | Add-Content test-results/installer-verification.txt

      - name: Generate verified build notes
        shell: pwsh
        run: |
          @"
          # CinaVault ReImagined v0.0.1

          Verified by GitHub Actions run ${{ github.run_number }} on commit ${{ github.sha }}.

          - Standalone release gates: passed
          - TypeScript validation: passed
          - Production frontend build: passed
          - Rust validation: passed
          - MSI packaging: passed
          - NSIS packaging: passed
          "@ | Set-Content test-results/BUILD_NOTES.md -Encoding utf8

      - name: Upload Windows installers and evidence
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-ReImagined-v0.0.1-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            test-results/BUILD_NOTES.md
            test-results/installer-verification.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish CinaVault ReImagined v0.0.1 prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cinavault-reimagined-v0.0.1
          target_commitish: ${{ github.sha }}
          name: CinaVault ReImagined v0.0.1
          body_path: test-results/BUILD_NOTES.md
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            test-results/BUILD_NOTES.md
            test-results/installer-verification.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CinaVault-ReImagined-v0.0.1-build-diagnostics
          path: |
            test-results/**
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
